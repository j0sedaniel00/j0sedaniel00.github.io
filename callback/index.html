<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting TikTok</title><style>:root{--bg:#12141c;--tx:#f4f4f6;--mut:#a9acb8;--ac:#FFD54A}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:720px;margin:0 auto;padding:40px 16px}h1{font-size:30px;margin:.2em 0}a{color:var(--ac)}small,.mut{color:var(--mut)}</style></head><body><main>
<h1 id="t">Almost done ✅</h1>
<p id="msg">Returning to Ahora Lo Sabes Publisher on your computer…</p>
<p><a id="volver" href="#">Open Ahora Lo Sabes Publisher</a></p>
<p class="mut"><small>If the app doesn't open, copy this page's full address and paste it in Claude to finish connecting.</small></p>
<p class="mut"><small>Ahora Lo Sabes Publisher · <a href="../index.html">Home</a></small></p>
<script>
var s = location.search;
if (s.indexOf("code=") < 0 && s.indexOf("error=") < 0) {
  document.getElementById("t").textContent = "Ahora Lo Sabes Publisher";
  document.getElementById("msg").textContent = "This page receives TikTok's response after you authorize the app.";
  document.getElementById("volver").style.display = "none";
} else {
  var destino = "http://127.0.0.1:8765/callback" + s;
  document.getElementById("volver").href = destino;
  setTimeout(function () { location.href = destino; }, 1200);
}
</script>
</main></body></html>
